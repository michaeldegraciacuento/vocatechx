<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Inter, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">T568B wire order in an RJ45 connector</title>
  <desc id="d">Looking at an RJ45 plug with the clip underneath and the gold contacts facing you, pins 1 to 8 from left to right are: white-orange, orange, white-green, blue, white-blue, green, white-brown, brown.</desc>
  <defs>
    <pattern id="wo" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><rect width="5" height="10" fill="#f97316"/></pattern>
    <pattern id="wg" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><rect width="5" height="10" fill="#16a34a"/></pattern>
    <pattern id="wb" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><rect width="5" height="10" fill="#2563eb"/></pattern>
    <pattern id="wn" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><rect width="5" height="10" fill="#92400e"/></pattern>
  </defs>
  <rect width="640" height="330" rx="14" fill="#f7f9fc"/>
  <text x="32" y="40" font-size="16" font-weight="700" fill="#172033">T568B (straight-through cable: same on both ends)</text>
  <text x="32" y="62" font-size="12" fill="#5b6577">Clip underneath, gold contacts facing you, pin 1 on the left.</text>

  <!-- RJ45 plug body -->
  <rect x="150" y="86" width="340" height="120" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" opacity="0.9"/>
  <g fill="#d4a72c">
    <rect x="172" y="94" width="18" height="26" rx="2"/><rect x="212" y="94" width="18" height="26" rx="2"/>
    <rect x="252" y="94" width="18" height="26" rx="2"/><rect x="292" y="94" width="18" height="26" rx="2"/>
    <rect x="332" y="94" width="18" height="26" rx="2"/><rect x="372" y="94" width="18" height="26" rx="2"/>
    <rect x="412" y="94" width="18" height="26" rx="2"/><rect x="452" y="94" width="18" height="26" rx="2"/>
  </g>
  <!-- Wires -->
  <g stroke="#475569" stroke-width="1">
    <rect x="172" y="124" width="18" height="150" fill="url(#wo)"/>
    <rect x="212" y="124" width="18" height="150" fill="#f97316"/>
    <rect x="252" y="124" width="18" height="150" fill="url(#wg)"/>
    <rect x="292" y="124" width="18" height="150" fill="#2563eb"/>
    <rect x="332" y="124" width="18" height="150" fill="url(#wb)"/>
    <rect x="372" y="124" width="18" height="150" fill="#16a34a"/>
    <rect x="412" y="124" width="18" height="150" fill="url(#wn)"/>
    <rect x="452" y="124" width="18" height="150" fill="#92400e"/>
  </g>
  <!-- Cable jacket inside the plug (strain relief) -->
  <rect x="160" y="250" width="320" height="56" rx="8" fill="#64748b"/>
  <text x="320" y="284" font-size="12" fill="#f1f5f9" text-anchor="middle">Outer jacket goes inside the plug</text>

  <g font-size="12" font-weight="700" fill="#172033" text-anchor="middle">
    <text x="181" y="82">1</text><text x="221" y="82">2</text><text x="261" y="82">3</text><text x="301" y="82">4</text>
    <text x="341" y="82">5</text><text x="381" y="82">6</text><text x="421" y="82">7</text><text x="461" y="82">8</text>
  </g>
  <g font-size="11" fill="#344054">
    <text x="508" y="110">1 White-orange</text><text x="508" y="128">2 Orange</text>
    <text x="508" y="146">3 White-green</text><text x="508" y="164">4 Blue</text>
    <text x="508" y="182">5 White-blue</text><text x="508" y="200">6 Green</text>
    <text x="508" y="218">7 White-brown</text><text x="508" y="236">8 Brown</text>
  </g>
  <text x="32" y="322" font-size="11" fill="#5b6577">Simplified drawing, not to scale.</text>
</svg>
