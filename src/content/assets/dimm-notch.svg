<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Inter, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DDR4 and DDR5 module key notches</title>
  <desc id="d">Two desktop memory modules side by side. Each has a single notch in its gold contact edge, at a different position, so each fits only its own type of slot.</desc>
  <rect width="640" height="330" rx="14" fill="#f7f9fc"/>

  <!-- DDR4 -->
  <text x="40" y="44" font-size="15" font-weight="700" fill="#172033">DDR4 module</text>
  <rect x="40" y="58" width="560" height="74" rx="4" fill="#1f7a4d"/>
  <g fill="#0f172a" opacity="0.85">
    <rect x="70" y="72" width="54" height="34" rx="2"/><rect x="140" y="72" width="54" height="34" rx="2"/>
    <rect x="210" y="72" width="54" height="34" rx="2"/><rect x="380" y="72" width="54" height="34" rx="2"/>
    <rect x="450" y="72" width="54" height="34" rx="2"/><rect x="520" y="72" width="54" height="34" rx="2"/>
  </g>
  <rect x="40" y="118" width="300" height="14" fill="#d4a72c"/>
  <rect x="352" y="118" width="248" height="14" fill="#d4a72c"/>
  <path d="M340 132 V118 Q346 110 352 118 V132 Z" fill="#f7f9fc"/>
  <line x1="346" y1="140" x2="346" y2="160" stroke="#2563eb" stroke-width="2"/>
  <text x="346" y="176" font-size="12" fill="#1d4ed8" text-anchor="middle">key notch</text>

  <!-- DDR5 -->
  <text x="40" y="214" font-size="15" font-weight="700" fill="#172033">DDR5 module</text>
  <rect x="40" y="228" width="560" height="74" rx="4" fill="#1f5a7a"/>
  <g fill="#0f172a" opacity="0.85">
    <rect x="70" y="242" width="54" height="34" rx="2"/><rect x="140" y="242" width="54" height="34" rx="2"/>
    <rect x="210" y="242" width="54" height="34" rx="2"/><rect x="380" y="242" width="54" height="34" rx="2"/>
    <rect x="450" y="242" width="54" height="34" rx="2"/><rect x="520" y="242" width="54" height="34" rx="2"/>
    <rect x="292" y="248" width="44" height="22" rx="2" fill="#334155"/>
  </g>
  <rect x="40" y="288" width="268" height="14" fill="#d4a72c"/>
  <rect x="320" y="288" width="280" height="14" fill="#d4a72c"/>
  <path d="M308 302 V288 Q314 280 320 288 V302 Z" fill="#f7f9fc"/>
  <line x1="314" y1="310" x2="314" y2="322" stroke="#2563eb" stroke-width="2"/>

  <text x="600" y="214" font-size="11" fill="#5b6577" text-anchor="end">Simplified drawing, not to scale.</text>
  <text x="600" y="44" font-size="11" fill="#5b6577" text-anchor="end">The notch must line up with the key in the slot.</text>
</svg>
